[project]
name = "raglab"
version = "0.1.0"
description = "Eval-first RAG & Agent lab: hybrid retrieval, citation-aware generation, and LLM evaluation in a clean, testable codebase."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gaoBUAA" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
local = [
    "sentence-transformers>=3.0",
]

[project.scripts]
raglab = "raglab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raglab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/raglab/cli.py" = ["B008"]  # typer 要求 Argument/Option 作为参数默认值
